# PIRCAS Aberturas — producción con Docker Compose.
#
#   docker compose up -d --build              # app + postgres
#   docker compose --profile proxy up -d      # + nginx (puertos 80/443)
#
# Variables: copiar .env.example a .env y completar (ver README).

name: pircas

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pircas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definí POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-pircas}
      # UTF-8 obligatorio (acentos, ñ, símbolos ×, –).
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pircas} -d ${POSTGRES_DB:-pircas}']
      interval: 10s
      timeout: 5s
      retries: 10
    # No se expone a internet. Para conectarte desde tu máquina usá un túnel SSH.

  app:
    build: .
    image: pircas-web:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pircas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pircas}
      NODE_ENV: production
      INTERNAL_URL: http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media:/app/public/media
    ports:
      # Solo local: el tráfico público entra por nginx (perfil "proxy") u otro proxy/Cloudflare.
      - '127.0.0.1:3000:3000'

  # Tareas puntuales: contenido inicial, estado de migraciones.
  #   docker compose --profile tools run --rm tools pnpm seed
  tools:
    build:
      context: .
      target: tools
    profiles: ['tools']
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pircas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-pircas}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - media:/app/public/media

  nginx:
    image: nginx:1.27-alpine
    profiles: ['proxy']
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
  media:
