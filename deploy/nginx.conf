# Proxy inverso para PIRCAS (perfil "proxy" de docker-compose).
# Certificados: colocar fullchain.pem y privkey.pem en deploy/certs (ej. Let's Encrypt / certbot)
# o poner Cloudflare delante y usar su certificado de origen.

upstream pircas_app {
  server app:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  # Redirige todo a HTTPS
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name pircas.com.ar www.pircas.com.ar;

  ssl_certificate     /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  # www → dominio principal
  if ($host = www.pircas.com.ar) {
    return 301 https://pircas.com.ar$request_uri;
  }

  # Subida de imágenes desde el panel (el CMS limita a 15 MB por archivo)
  client_max_body_size 20m;

  gzip on;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

  # Assets con hash de Next: caché de 1 año
  location /_next/static/ {
    proxy_pass http://pircas_app;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://pircas_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }
}
