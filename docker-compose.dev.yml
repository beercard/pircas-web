# Solo para desarrollo local: una base PostgreSQL accesible en localhost:5432.
#   docker compose -f docker-compose.dev.yml up -d
name: pircas-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pircas
      POSTGRES_PASSWORD: pircas
      POSTGRES_DB: pircas
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    ports:
      - '5432:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

volumes:
  pgdata-dev:
